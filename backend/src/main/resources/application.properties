#spring.config.import=optional:file:.env
spring.main.allow-circular-references=true
spring.application.name=InventoryManagementSystem
#spring.datasource.url=${SPRING_DATASOURCE_URL} //uncomment while pushing to docker
#spring.datasource.username=${SPRING_DATASOURCE_USERNAME} //uncomment while pushing to docker
#spring.datasource.password=${SPRING_DATASOURCE_PASSWORD} //uncomment while pushing to docker
spring.datasource.url=jdbc:mysql://localhost:3306/inventory
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
server.port=8080



